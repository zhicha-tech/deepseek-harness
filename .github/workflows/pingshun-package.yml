name: Package Pingshun Buddy · unsigned test installers

# 测试分发专用：在 GitHub 托管 runner 上打包内置 @deepseek-ai/dsh-pingshun-buddy
# 的桌面安装包（Windows exe / macOS dmg），不签名、不公证，不接入官方发布通道。
# buddy bundle 与其 .env（模型服务配置）随安装包发布，用户安装后开箱即用。
#
# 品牌：产品名/显示名/appId/图标全部由环境变量覆盖为平顺 Buddy；
# 路径与技术标识使用 ASCII 的 pingshunbuddy，显示文本使用「平顺 Buddy」。
# NSIS 多语言安装文本里的 DeepSeek Harness 在打包前替换为显示名。
#
# 官方 workflows（windows-package.yml / macos-package.yml）绑定 self-hosted 签名
# 机器与发布通道，不能复用；本 workflow 只调用官方 package:win:x64:unsigned /
# package:mac:arm64:unsigned 命令。

on:
  push:
    branches: [pingshun/buddy-packaging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write unsigned Windows packaging settings (Pingshun branding)
        # The official loader requires .env.windows even for unsigned builds.
        # Test-stage dummy HTTPS origins satisfy the policy parser; these
        # installers are not connected to any update service.
        # Branding: productName drives install paths (ASCII pingshunbuddy);
        # displayName is the user-visible 平顺 Buddy; icons come from the
        # buddy bundle's generated resources. The heredoc is UNQUOTED so
        # $GITHUB_WORKSPACE expands into absolute icon paths (a quoted heredoc
        # would leave the literal variable name and electron-builder would fall
        # back to the stock Electron icon).
        shell: bash
        run: |
          cat > apps/desktop/.env.windows <<EOF
          DSH_DESKTOP_APP_ID=com.pingshun.buddy.local
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://example.com"]}
          DSH_DESKTOP_PRODUCT_NAME=pingshunbuddy
          DSH_DESKTOP_DISPLAY_NAME=平顺 Buddy
          DSH_DESKTOP_ICON_WINDOWS=$GITHUB_WORKSPACE/packages/pingshun/buddy/resources/icon-windows.png
          DSH_DESKTOP_TRAY_WINDOWS=$GITHUB_WORKSPACE/packages/pingshun/buddy/resources/tray-windows.ico
          EOF
      - name: Copy Buddy installer brand assets
        # The custom NSIS wizard paints brand.bmp / brand-dark.bmp (and their
        # 2x variants) converted from apps/desktop/installer/assets/*.png by
        # prepare-windows-installer.ps1. Replace those sources with the Buddy
        # brand images so the wizard shows the Buddy mark instead of the
        # DeepSeek whale.
        shell: bash
        run: |
          cp packages/pingshun/buddy/resources/installer-brand.png apps/desktop/installer/assets/brand.png
          cp packages/pingshun/buddy/resources/installer-brand-2x.png apps/desktop/installer/assets/brand-2x.png
          cp packages/pingshun/buddy/resources/installer-brand-dark.png apps/desktop/installer/assets/brand-dark.png
          cp packages/pingshun/buddy/resources/installer-brand-dark-2x.png apps/desktop/installer/assets/brand-dark-2x.png
          cp packages/pingshun/buddy/resources/uninstaller-sidebar.png apps/desktop/installer/assets/uninstaller-sidebar.png
      - name: Rebrand desktop UI strings, NSIS locales and publisher
        # apps/desktop/src/locale.ts carries 96 user-visible "DeepSeek Harness"
        # strings (about panel, about/hide/quit/open menus, quit confirmation,
        # startup failure, welcome title) across 8 languages; main.ts hardcodes
        # the about-panel applicationName. Replace all with the Buddy display
        # name in the CI workspace before the desktop build compiles them.
        # NSIS locale JSONs carry wizard messages; package.json author.name is
        # the NSIS publisher/company field.
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            for (const path of ["apps/desktop/src/locale.ts", "apps/desktop/src/main.ts"]) {
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.split("DeepSeek Harness").join("平顺 Buddy"));
            }
            const dir = "apps/desktop/installer/locales";
            for (const file of fs.readdirSync(dir)) {
              if (!file.endsWith(".json")) continue;
              const path = dir + "/" + file;
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.split("DeepSeek Harness").join("平顺 Buddy"));
            }
            const manifestPath = "apps/desktop/package.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.author && typeof manifest.author === "object") {
              manifest.author.name = "平顺 Buddy";
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, undefined, 2) + "\n");
            }
            console.log("Desktop UI strings, NSIS locales and publisher rebranded to 平顺 Buddy");
          '
      - name: Package unsigned Windows installer (full local build + runtime + NSIS)
        env:
          DSH_CLIENT_BUILD_PROFILE: local
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pingshun-buddy-windows-x64
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write unsigned macOS packaging settings (Pingshun branding)
        shell: bash
        run: |
          cat > apps/desktop/.env.macos <<'EOF'
          DSH_DESKTOP_APP_ID=com.pingshun.buddy.local
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_PRODUCT_NAME=pingshunbuddy
          DSH_DESKTOP_DISPLAY_NAME=平顺 Buddy
          DSH_DESKTOP_ICON_MACOS=$GITHUB_WORKSPACE/packages/pingshun/buddy/resources/icon-macos.png
          EOF
      - name: Rebrand desktop UI strings and publisher (macOS)
        # Same locale.ts / main.ts replacement as the Windows job: the macOS
        # application menu's About/Hide/Quit items and the about panel all
        # carry the product name.
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            for (const path of ["apps/desktop/src/locale.ts", "apps/desktop/src/main.ts"]) {
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.split("DeepSeek Harness").join("平顺 Buddy"));
            }
            const manifestPath = "apps/desktop/package.json";
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.author && typeof manifest.author === "object") {
              manifest.author.name = "平顺 Buddy";
              fs.writeFileSync(manifestPath, JSON.stringify(manifest, undefined, 2) + "\n");
            }
            console.log("Desktop UI strings and publisher rebranded to 平顺 Buddy");
          '
      - name: Package unsigned macOS disk image (full local build + runtime + DMG)
        env:
          DSH_CLIENT_BUILD_PROFILE: local
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:mac:arm64:unsigned
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pingshun-buddy-macos-arm64
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
